<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHARACTERS | CREATIVE ARCHIVE</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #fff;
  color: #222;
  font-family: Arial, "Noto Sans JP", sans-serif;
}

header {
  padding: 24px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #ddd;
}

.logo {
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 2px;
}

header a {
  color: #444;
  text-decoration: none;
  font-size: 13px;
}

main { padding: 70px 7%; }

.subtitle {
  color: #888;
  letter-spacing: 4px;
  font-size: 12px;
}

h1 {
  font-size: 42px;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.description {
  color: #777;
  margin-bottom: 50px;
}

.categories {
  display: flex;
  gap: 25px;
  border-bottom: 1px solid #ddd;
  margin-bottom: 35px;
}

.categories button {
  background: none;
  border: none;
  padding: 15px 0;
  cursor: pointer;
  color: #888;
  font-size: 14px;
}

.categories button.active {
  color: #222;
  border-bottom: 2px solid #222;
}

.search {
  width: 100%;
  max-width: 450px;
  padding: 14px;
  border: 1px solid #ddd;
  margin-bottom: 35px;
  font-size: 14px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
}

.card {
  display: block;
  text-decoration: none;
  color: #222;
}

.card-image {
  aspect-ratio: 3 / 4;
  background: #f1f1f1;
  overflow: hidden;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.card h3 {
  margin: 15px 0 5px;
  font-size: 17px;
}

.card p {
  margin: 0;
  font-size: 12px;
  color: #888;
}

.empty {
  display: none;
  color: #999;
  padding: 40px 0;
}

footer {
  border-top: 1px solid #ddd;
  padding: 30px;
  text-align: center;
  color: #999;
  font-size: 12px;
}

@media(max-width: 700px) {
  header { padding: 20px; }
  main { padding: 55px 20px; }
  h1 { font-size: 32px; }

  .cards {
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">CREATIVE ARCHIVE</div>
  <a href="index.html">HOME</a>
</header>

<main>

<div class="subtitle">ORIGINAL CHARACTER DATABASE</div>

<h1>CHARACTERS</h1>

<p class="description">キャラクターアーカイブ</p>

<div class="categories">
  <button class="active" data-category="all">ALL</button>
  <button data-category="takuma">詫摩組</button>
  <button data-category="other">その他</button>
</div>

<input
  class="search"
  id="search"
  type="search"
  placeholder="名前・所属・役職で検索..."
>

<div class="cards">

  <a href="izumida.html"
     class="card"
     data-category="takuma">

    <div class="card-image">
      <img src="izumida.jpg" alt="泉田 成継">
    </div>

    <h3>泉田 成継</h3>
    <p>30歳 / 舎弟頭</p>
    <p>詫摩組</p>

  </a>

  <div class="card" data-category="takuma">
    <div class="card-image"></div>
    <h3>有明</h3>
    <p>30代 / 舎弟頭</p>
    <p>詫摩組</p>
  </div>

</div>

<p class="empty" id="empty">
該当するキャラクターはいません。
</p>

</main>

<footer>
© CREATIVE ARCHIVE
</footer>

<script>
const buttons = document.querySelectorAll(".categories button");
const cards = document.querySelectorAll(".card");
const search = document.getElementById("search");
const empty = document.getElementById("empty");

let category = "all";

function updateCards() {
  let count = 0;

  cards.forEach(card => {
    const matchesCategory =
      category === "all" ||
      card.dataset.category === category;

    const matchesSearch =
      card.innerText.toLowerCase()
      .includes(search.value.toLowerCase());

    const visible = matchesCategory && matchesSearch;

    card.style.display = visible ? "" : "none";

    if (visible) count++;
  });

  empty.style.display = count === 0 ? "block" : "none";
}

buttons.forEach(button => {
  button.addEventListener("click", () => {
    buttons.forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    category = button.dataset.category;
    updateCards();
  });
});

search.addEventListener("input", updateCards);
</script>

</body>
</html>
